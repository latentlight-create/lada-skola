<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ladina škola">
<meta name="theme-color" content="#f1efe9">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Ladina škola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
:root{
  /* Layout: paper page that scrolls; one big headline the figures walk on, question block under a rule line,
     options as bordered boxes. Ink on cream with one red, like Aeroevents. */
  --paper:#f1efe9; --ink:#0b0b0b; --line:#1d1d1d; --red:#d92f26; --muted:#6c675d; --soft:#e3dfd4; --white:#fbfaf7;
  --bg:var(--paper); --fg:var(--ink);
  --display:"Archivo Black","Arial Black",Impact,sans-serif; --body:"IBM Plex Sans",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
#app,.pata,.top{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.gutter{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin-inline:auto;min-width:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px}
.brand{font-family:var(--display);letter-spacing:.08em;font-size:14px}
.top .right{display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.top .right b{color:var(--red)}
.top button{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.prog{height:3px;background:var(--soft)}
.prog i{display:block;height:100%;width:0;background:var(--c,var(--red));transition:width .35s}

/* ---------- hero ---------- */
.hero{padding-block:22px 10px;position:relative}
.hero.prsi::after{content:"";position:absolute;inset:-10px 0 0;background:repeating-linear-gradient(105deg,transparent 0 16px,rgba(11,11,11,.28) 16px 17px);background-size:100% 60px;animation:dest .45s linear infinite;pointer-events:none}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(68px,12vw,132px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance;word-break:keep-all}
.sub{margin:10px 0 0;color:var(--muted);font-size:16px;letter-spacing:.04em}

/* ---------- lists ---------- */
.screen{padding-block:8px 40px}
.areas{display:grid;gap:14px;margin-top:10px}
.areaCard,.exCard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:1.5px solid var(--line);border-left:12px solid var(--c,var(--line));border-radius:14px;padding:18px 20px;background:var(--white);position:relative;transition:transform .08s}
.areaCard:active,.exCard:active{transform:translateY(2px)}
.areaCard .num,.exCard .num{font-family:var(--display);font-size:28px;color:var(--c,var(--red));min-width:46px}
.areaCard b,.exCard b{font-size:21px;display:block;font-weight:700;line-height:1.15}
.areaCard small,.exCard small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.exCard .txt{flex:1;min-width:0}
.exCard .best{font-variant-numeric:tabular-nums;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.exCard .best.full{color:var(--red);font-weight:700}
.backrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.lnk{font-size:14px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:1px}
.lnk:active{color:var(--red)}

/* ---------- exercise ---------- */
.status{display:flex;align-items:center;gap:16px;margin:6px 0 14px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.status .counter{font-variant-numeric:tabular-nums;color:var(--ink)}
.status .streak{color:var(--red);font-weight:700}
h2.exTitle{font-family:var(--body);font-weight:700;font-size:clamp(22px,3.4vw,30px);margin:0 0 18px;line-height:1.15;text-wrap:balance}
.qcard{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0 22px;position:relative;min-height:90px}
.ask{margin:0 0 10px;color:var(--muted);font-size:15px;letter-spacing:.03em}
.sent{margin:0;font-size:24px;line-height:1.4}
.sent.big{font-size:clamp(26px,4vw,34px);font-weight:700;line-height:1.2}
mark{background:none;color:var(--red);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.word-big{font-family:var(--display);font-size:clamp(36px,6vw,56px);line-height:1.1;margin:0 0 10px;letter-spacing:.01em}
.gap{display:inline-block;min-width:1em;border-bottom:3px solid var(--line);text-align:center;color:var(--red);line-height:1;padding:0 3px;margin:0 2px}
.gap.cur{background:#fff3b0;border-color:var(--red)}
.gap.filled{color:var(--ink);border-color:transparent;background:none;min-width:0;padding:0;margin:0}
.hint{margin:10px 0 0;color:var(--muted);font-size:15px}
.options{display:grid;gap:10px;margin-top:16px;grid-template-columns:1fr}
.options.two{grid-template-columns:1fr 1fr}
.options.letters{grid-template-columns:repeat(4,1fr)}
.options.five{grid-template-columns:repeat(5,1fr)}
.options.three{grid-template-columns:repeat(3,1fr)}
.options.keypad{grid-template-columns:repeat(2,1fr)}
.opt{border:2px solid var(--line);border-radius:14px;background:var(--white);padding:13px 16px;font-size:19px;font-weight:600;min-height:54px;text-align:center;line-height:1.25;transition:transform .08s,background .12s;min-width:0;overflow-wrap:anywhere}
.opt:active{transform:translateY(2px)}
.opt.letter{font-family:var(--display);font-size:30px;font-weight:400;padding:8px}
.opt.ok{background:#2fbf71;color:#fff;border-color:#239a5b}
.opt.bad{background:#f8e1de;color:var(--red);border-color:var(--red);animation:shake .3s;opacity:.85}
.opt.primary{background:var(--c,var(--red));color:#fff;border-color:var(--c,var(--red))}
.opt.wide{grid-column:1/-1}
.opt.key{text-align:left;font-weight:500;font-size:16px;padding:10px 14px;min-height:46px}
.opt.key b{font-family:var(--display);font-weight:400;color:var(--red);margin-right:8px;font-size:18px}
.opt:disabled{cursor:default}
.feedback{margin:14px 0 0;min-height:1.5em;font-size:16px;color:var(--muted)}
.feedback.ok{color:#1f9e5a;font-weight:600}
.feedback.bad{color:var(--red)}
/* číslování slovních druhů */
.numwords{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.nw{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:6px;border:1.5px solid transparent}
.nw .n{font-family:var(--display);color:var(--red);font-size:18px;min-width:1.4em;height:1.3em;line-height:1.3em;border-bottom:2px dashed var(--soft)}
.nw .w{font-size:24px;line-height:1.2}
.nw.sel{border-color:var(--line);background:var(--white)}
.nw.ok .n{color:#1f9e5a;border-color:transparent}
.nw.bad{border-color:var(--red);background:#f8e1de}
.nw.bad .n{color:var(--red)}
/* osoba, číslo, způsob, čas */
.rows{display:grid;gap:10px;margin-top:14px}
.row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px}
.row .lbl{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:16px;font-weight:600;background:var(--white);min-height:40px}
.segb.sel{background:var(--ink);color:#fff}
.segb.bad{border-color:var(--red);color:var(--red);background:#f8e1de}
.segb.ok{background:#2fbf71;color:#fff;border-color:#239a5b}
/* křížovka */
.kriz{display:grid;gap:3px;margin:8px 0 6px;width:max-content;max-width:100%}
.kriz .r{display:flex;gap:3px}
.kriz .c{width:clamp(26px,3.6vw,36px);aspect-ratio:1;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:clamp(14px,2vw,20px);background:var(--white)}
.kriz .c.sp{border-color:transparent;background:none}
.kriz .c.zl{background:#ffe08a}
.kriz .r.cur .c:not(.sp){border-color:var(--red)}
.kriz .c.zl.done{background:var(--red);color:#fff}
.tajenka{font-family:var(--display);font-size:clamp(24px,4vw,40px);letter-spacing:.08em;margin:8px 0 0}
.tajenka span{color:var(--red)}
/* výsledek */
.vysledek h3{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,56px);margin:0;line-height:1}
.vysledek .skore{font-family:var(--display);font-size:clamp(40px,8vw,72px);color:var(--red);line-height:1;margin:10px 0}
.vysledek p{margin:6px 0 0;font-size:18px}
/* pata */
.pata{border-top:1px solid var(--line);padding:22px 0 60px;position:relative;margin-top:40px}
.pata .wrap{display:flex;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.shake{animation:shake .3s}
.swept{transition:transform .8s cubic-bezier(.4,-.2,.9,.5),opacity .8s;transform:translate(110vw,-10vh) rotate(18deg)!important;opacity:0}
#noc{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 110%,#22326e 0%,#0a0f2c 70%);opacity:0;transition:opacity .7s;pointer-events:none;z-index:44}
#noc.on{opacity:.93}
#fw{position:fixed;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:45}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.cf{position:absolute;width:9px;height:13px;border-radius:3px;animation:cf 1s ease-out forwards}
#blesk{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
#blesk.on{animation:blesk .4s}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes dest{to{background-position:0 60px}}
@keyframes blesk{0%{opacity:0}15%{opacity:.9}40%{opacity:.2}55%{opacity:.6}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:520px){.row{grid-template-columns:1fr}.options.five{grid-template-columns:repeat(3,1fr)}.options.keypad{grid-template-columns:1fr}.opt{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top gutter">
  <div class="wrap">
    <div class="brand">LADINA ŠKOLA</div>
    <div class="right"><span>body <b id="bodyCelkem">0</b></span><button id="mute" aria-label="Zvuk">zvuk</button></div>
  </div>
  <div class="prog"><i id="progFill"></i></div>
</header>

<main id="app" class="gutter">
  <div class="wrap">
    <section class="hero"><h1 id="h1">Ahoj, Lado</h1><p class="sub" id="sub">Vyber si, co dnes procvičíš. Postavičky se dívají.</p></section>

    <section id="home" class="screen">
      <div class="areas" id="areaList"></div>
    </section>

    <section id="area" class="screen" hidden>
      <div class="backrow"><button class="lnk" id="areaBack">← Zpět na výběr</button></div>
      <div class="areas" id="exList"></div>
    </section>

    <section id="exercise" class="screen" hidden>
      <div class="status"><button class="lnk" id="exBack">← Zpět</button><span class="counter" id="counter"></span><span class="streak" id="streak"></span></div>
      <h2 class="exTitle" id="exTitle"></h2>
      <div class="qcard" id="qcard"><div id="qPrompt"></div></div>
      <div class="options" id="qOptions"></div>
      <p class="feedback" id="feedback"></p>
    </section>
  </div>
</main>

<div id="noc"></div><canvas id="fw"></canvas><div id="fx"></div><div id="blesk"></div>
<footer class="pata gutter" id="pata"><div class="wrap"><span>Lada · 5. třída</span><span id="pataText">Postavičky reagují na to, co děláš.</span></div></footer>

<script>
//__FIGURKY__
//__KONE__
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>esc(s).replace(/\[([^\]]+)\]/g,'<mark>$1</mark>');
const gapHTML=w=>esc(w).replace('_','<span class="gap cur">&nbsp;</span>');

/* ---------- zvuk (tichý, vypnutelný) ---------- */
const Snd={ctx:null,muted:false,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); },
  tone(f,dur,o={}){ if(!this.ctx||this.muted) return; const c=this.ctx,t=c.currentTime+(o.at||0),os=c.createOscillator(),g=c.createGain(); os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t); if(o.slide) os.frequency.exponentialRampToValueAtTime(o.slide,t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(o.vol||0.12,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); os.connect(g).connect(c.destination); os.start(t); os.stop(t+dur+0.05); },
  tick(){ this.tone(900,0.04,{type:'square',vol:.035}); },
  ding(){ this.tone(740,0.1,{type:'triangle',vol:.1}); this.tone(1110,0.22,{type:'triangle',vol:.08,at:.09}); },
  buzz(){ this.tone(160,0.22,{type:'sawtooth',vol:.06,slide:110}); },
  fanfare(){ [[523,0],[659,.1],[784,.2],[1047,.3]].forEach(([f,d])=>this.tone(f,.28,{type:'triangle',vol:.09,at:d})); },
  whistle(){ this.tone(380,.7,{type:'sine',vol:.05,slide:1500}); },
  boom(){ this.tone(90,.5,{type:'sine',vol:.22,slide:40}); if(!this.ctx||this.muted) return; const c=this.ctx,n=Math.floor(c.sampleRate*.6),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2); const s=c.createBufferSource(); s.buffer=buf; const g=c.createGain(); g.gain.value=.35; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; s.connect(lp).connect(g).connect(c.destination); s.start(); },
};
document.addEventListener('pointerdown',()=>Snd.init(),{passive:true});

/* ---------- hlášky postaviček ---------- */
const CHVALA=['Jo!','Čistá práce.','Přesně.','Hezky, Lado.','To je ono.','Jedeme dál.','Bez chyby.','Tak to má být.','Dobrý.','Vidíš, že to jde.','Jasně.','Správně.'];
const UTECHA=['Hm, to ne.','Skoro.','Zkus to ještě jednou.','To se stane každému.','Ne. Ale nevadí.','Au.','Podívej se znova.','Ještě ne.'];
const NUDA=['Lado? Jsi tam?','My tu klidně počkáme.','Tak co, jdeme dál?','Hm, nic se neděje.','Nekoukej z okna.','Já si zatím sednu.'];
const HLASKY=['Nesahej na mě.','Já tu jen sedím.','Pozor, ať nespadnu.','Hele, ona se učí.','Nerušit, prosím.','Zase ty?','Jdu se projít.','Hned jsem zpátky.','Tady je hezký výhled.','Nespadni z té čáry.'];

/* ---------- obsah: slovní druhy ---------- */
const DRUHY=[{n:1,name:'podstatné jméno'},{n:2,name:'přídavné jméno'},{n:3,name:'zájmeno'},{n:4,name:'číslovka'},{n:5,name:'sloveso'},{n:6,name:'příslovce'},{n:7,name:'předložka'},{n:8,name:'spojka'},{n:9,name:'částice'},{n:10,name:'citoslovce'}];
const NUM=[
  {s:'Oba kluci se vesele přivítali.',a:[4,1,3,6,5]},
  {s:'Celá rodina si svůj pobyt v Itálii náramně užila.',a:[2,1,3,3,1,7,1,6,5]},
  {s:'Ach, ten malý pes rychle běžel domů.',a:[10,3,2,1,6,5,6]},
  {s:'Dva kamarádi hráli včera fotbal a hokej.',a:[4,1,5,6,1,8,1]},
  {s:'Ty jsi opravdu šikovná holka.',a:[3,5,6,2,1]},
  {s:'Naše babička upekla tři koláče.',a:[3,1,5,4,1]},
  {s:'Hurá, zítra jedeme na výlet!',a:[10,6,5,7,1]},
  {s:'Já tam ale nepůjdu.',a:[3,6,8,5]},
  {s:'Pes štěkal, protože viděl kočku.',a:[1,5,8,5,1]},
  {s:'První sníh napadl dnes v noci.',a:[4,1,5,6,7,1]},
  {s:'Ano, to je můj bratr.',a:[9,3,5,3,1]},
  {s:'Lada ráda čte dobrodružné knihy.',a:[1,6,5,2,1]},
  {s:'Včera jsme si koupili dvě zmrzliny.',a:[6,5,3,5,4,1]},
  {s:'Malá kočka tiše seděla pod stolem.',a:[2,1,6,5,7,1]},
];
const SLV=[
  {v:'zkyslo by',a:[2,0,2,3]},{v:'máš',a:[1,0,0,1]},{v:'zkontrolujte si',a:[1,1,1,3]},{v:'budeme sportovat',a:[0,1,0,2]},
  {v:'četla jsem',a:[0,0,0,0]},{v:'pojď',a:[1,0,1,3]},{v:'hráli byste',a:[1,1,2,3]},{v:'píše',a:[2,0,0,1]},
  {v:'uvidí',a:[2,0,0,2]},{v:'nezapomeňme',a:[0,1,1,3]},{v:'spali jsme',a:[0,1,0,0]},{v:'chtěl bych',a:[0,0,2,3]},
  {v:'koupíš',a:[1,0,0,2]},{v:'zpívají',a:[2,1,0,1]},{v:'přinesl',a:[2,0,0,0]},{v:'běžte',a:[1,1,1,3]},
];
const SLV_ROWS=[{label:'Osoba',opts:['1.','2.','3.']},{label:'Číslo',opts:['jednotné','množné']},{label:'Způsob',opts:['oznamovací','rozkazovací','podmiňovací']},{label:'Čas',opts:['minulý','přítomný','budoucí','neurčuje se']}];
const DV=[
  {s:'Máš svůj sborníček prací?',a:'tázací'},{s:'Správnost řešení si zkontrolujte podle klíče.',a:'rozkazovací'},{s:'Kdy jelen shazuje parohy?',a:'tázací'},
  {s:'Vše schlaďte.',a:'rozkazovací'},{s:'Vyzvedni spravené boty.',a:'rozkazovací'},{s:'Umíš zúžit kalhoty?',a:'tázací'},
  {s:'Mléko by zkyslo.',a:'oznamovací'},{s:'Kéž by už byly prázdniny!',a:'přací'},{s:'Ať se ti to povede!',a:'přací'},
  {s:'Studem zčervenala.',a:'oznamovací'},{s:'Nesahej na to!',a:'rozkazovací'},{s:'Kdy pojedeme k babičce?',a:'tázací'},
  {s:'U vody nás sužovali komáři.',a:'oznamovací'},{s:'Kéž by zítra nepršelo.',a:'přací'},{s:'Zavři, prosím, okno.',a:'rozkazovací'},
  {s:'Proč se směješ?',a:'tázací'},{s:'Ať už je léto!',a:'přací'},{s:'Zítra jedeme do Itálie.',a:'oznamovací'},
];
const DV_WHY={'tázací':'Ptáme se, na konci je otazník.','rozkazovací':'Někomu něco přikazujeme nebo o něco žádáme.','oznamovací':'Něco oznamujeme, na konci je tečka.','přací':'Něco si přejeme (kéž, ať), na konci bývá vykřičník.'};

/* ---------- obsah: předpony a předložky ---------- */
const PP=[

  pp3:{area:'pp',title:'Předpona s-, nebo z-?',desc:'s- = dolů, z povrchu, dohromady · z- = změna stavu, dokončení.',

  pp4:{area:'pp',title:'Křížovka s tajenkou',desc:'Slova s předponami s- a z- do mřížky. Vyjde tajenka.',

      qs.push(qChoice(()=>krizHTML(KRIZ.rows.length),shuffle([{label:'STEZKA',value:1},{label:'TRASA',value:0},{label:'CESTA',value:0}]),1,{grid:'three',why:'Tajenka: CYKLOSTEZKA'})); return qs; }},
  pr1:{area:'pr',title:'Vyjmenovaná slova',desc:'i, í, y, nebo ý? Po B, L, M, P, S, V.',

  pr2:{area:'pr',title:'ě, nebo je?',desc:'objem a vjezd, ale oběd a věda.',
    build(){ return shuffle(EJ).slice(0,10).map(it=>qChoice(`<p class="word-big">${gapHTML(it.w)}</p>`,[{label:'ě',value:'ě',cls:'letter'},{label:'je',value:'je',cls:'letter'}],it.a,{grid:'two',fill:it.a,why:it.why})); }},
  pr3:{area:'pr',title:'mě, nebo mně?',desc:'Ve slovech i u zájmena já. Pomůcka: tě → mě, tobě → mně.',
    build(){ const slova=shuffle(MM).slice(0,6).map(it=>qChoice(`<p class="word-big">${gapHTML(it.w)}</p>`,[{label:'mě',value:'mě',cls:'letter'},{label:'mně',value:'mně',cls:'letter'}],it.a,{grid:'two',fill:it.a,why:it.why}));
      const zaj=shuffle(MMZ).slice(0,6).map(it=>qChoice(`<p class="ask">Doplň tvar zájmena já:</p><p class="sent big">${gapHTML(it.s.replace('(_)','_'))}</p><p class="hint">Pomůcka: dosaď tě / tobě.</p>`,[{label:'mě',value:'mě',cls:'letter'},{label:'mně',value:'mně',cls:'letter'}],it.a,{grid:'two',fill:it.a,why:it.why}));
      return shuffle(slova.concat(zaj)); }},
  pr4:{area:'pr',title:'Párové souhlásky',desc:'Řekni si jiný tvar slova: led – ledu.',

  pr5:{area:'pr',title:'Slovo základové',desc:'Od kterého slova je slovo utvořeno?',

  sd1:{area:'sd',title:'Očísluj slovní druhy',desc:'Zapiš nad každé slovo číslo slovního druhu.',
    build(){ return shuffle(NUM).slice(0,6).map(it=>{ const words=it.s.split(' '); return {type:'numbering',prompt:'Klepni na slovo a vyber číslo slovního druhu.',words,answer:it.a,vals:new Array(words.length).fill(0),sel:0}; }); }},

};
const AREAS=[
  {id:'pp',big:'Předpony',title:'Předpony a předložky',desc:'Dohromady, nebo zvlášť · s-/z- · roz-, bez-, nad-, pod-, od- · křížovka',ex:['pp1','pp2','pp3','pp4']},
  {id:'pr',big:'Pravopis',title:'Pravopis',desc:'Vyjmenovaná slova · ě/je · mě/mně · párové souhlásky · slovo základové',ex:['pr1','pr2','pr3','pr4','pr5']},
  {id:'sd',big:'Slovní druhy',title:'Slovní druhy a věty',desc:'Číslování slovních druhů · osoba, číslo, způsob, čas · druhy vět',ex:['sd1','sd2','sd3']},
];
function krizHTML(k){
  const cols=9; const rows=KRIZ.rows.map((r,ri)=>{ let cells=''; for(let c=0;c<cols;c++){ const inside=c>=r.col&&c<r.col+r.w.length; if(!inside){ cells+='<span class="c sp"></span>'; continue; } const done=ri<k; const zl=c===KRIZ.col; cells+=`<span class="c${zl?' zl':''}${done&&zl?' done':''}">${done?esc(r.w[c-r.col]):''}</span>`; } return `<div class="r${ri===k?' cur':''}">${cells}</div>`; }).join('');
  const taj=KRIZ.rows.map((r,ri)=>ri<k?r.w[KRIZ.col-r.col]:'·').join('');
  const head=k<KRIZ.rows.length?`<p class="ask">${esc(KRIZ.rows[k].clue)}</p>`:`<p class="ask">Tajenka: Cesta určená pro cyklisty se nazývá CYKLO___.</p>`;
  return head+`<div class="kriz">${rows}</div><p class="tajenka">CYKLO<span>${esc(taj)}</span></p>`;
}

/* ---------- stav a uložení ---------- */
const KEY='lada-skola-v1';
let store={best:{},muted:false};
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object') store=Object.assign(store,s); }catch(e){} Snd.muted=!!store.muted; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }
const state={area:null,ex:null,qs:[],i:0,points:0,streak:0,qErr:0,locked:false,cekaNext:false,nextT:null,oslava:false};
const bodyCelkem=()=>Object.values(store.best).reduce((a,b)=>a+(b.p||0),0);
const BARVY={pp:'#2f6de0',pr:'#2fbf71',sd:'#ff8f1f'};
const KONFETY=['#d92f26','#2f6de0','#2fbf71','#ffd23f','#ff8f1f','#8e5cf6','#0b0b0b'];

/* ---------- obrazovky ---------- */
function show(id,big,sub){ ['home','area','exercise'].forEach(s=>{ $('#'+s).hidden=(s!==id); }); $('#h1').textContent=big; $('#sub').textContent=sub||''; $('#sub').hidden=!sub; window.scrollTo(0,0); requestAnimationFrame(()=>Figurky.prestav()); }
function renderAreaList(){ $('#areaList').innerHTML=AREAS.map((a,i)=>`<button class="areaCard" data-area="${a.id}" style="--c:${BARVY[a.id]}"><span class="num">${i+1}</span><span><b>${esc(a.title)}</b><small>${esc(a.desc)}</small></span></button>`).join(''); }
function renderHome(){ $('#bodyCelkem').textContent=bodyCelkem(); $('#progFill').style.width='0%'; document.documentElement.style.setProperty('--c','#d92f26'); updateMute(); show('home','Ahoj, Lado','Vyber si, co dnes procvičíš. Postavičky se dívají.'); }
function renderArea(id){
  const a=AREAS.find(x=>x.id===id); state.area=a; document.documentElement.style.setProperty('--c',BARVY[id]);
  $('#exList').innerHTML=a.ex.map((eid,i)=>{ const e=EX[eid]; const b=store.best[eid]; const best=b?`${b.p} / ${b.t}`:'—'; return `<button class="exCard" data-ex="${eid}" style="--c:${BARVY[id]}"><span class="num">${i+1}</span><span class="txt"><b>${esc(e.title)}</b><small>${esc(e.desc)}</small></span><span class="best${b&&b.p===b.t?' full':''}">${best}</span></button>`; }).join('');
  $('#progFill').style.width='0%'; show('area',a.big,a.desc);
}
function updateMute(){ $('#mute').textContent=store.muted?'ticho':'zvuk'; }
function uklid(){ document.querySelectorAll('#exercise .swept').forEach(el=>el.classList.remove('swept')); }
function startExercise(eid){
  const e=EX[eid]; state.ex=Object.assign({id:eid},e); state.area=AREAS.find(a=>a.id===e.area); document.documentElement.style.setProperty('--c',BARVY[e.area]);
  state.qs=e.build(); state.i=0; state.points=0; state.streak=0; state.qErr=0; state.locked=false; state.oslava=false; state.cekaNext=false; clearTimeout(state.nextT);
  Uklizeci.stop(); FW.stop(); $('#noc').classList.remove('on'); uklid();
  $('#exTitle').textContent=e.title; show('exercise',state.area.big,''); renderQuestion();
  setTimeout(()=>Figurky.rekni(pick(['Jdeme na to.','Tak ukaž.','Držíme palce.','Začínáme.','Hezky v klidu.']),2200),900);
}
function cur(){ return state.qs[state.i]; }
function feedback(t,cls){ const f=$('#feedback'); f.textContent=t||''; f.className='feedback '+(cls||''); }
function ukazSerii(){ $('#streak').textContent=state.streak>=3?'🔥 série '+state.streak:''; }
function renderQuestion(){
  const q=cur(); $('#counter').textContent=(state.i+1)+' / '+state.qs.length; $('#progFill').style.width=(state.i/state.qs.length*100)+'%'; ukazSerii();
  feedback(''); const P=$('#qPrompt'),O=$('#qOptions'); O.className='options'; state.locked=false; state.qErr=0; state.cekaNext=false; clearTimeout(state.nextT);
  if(q.type==='choice') renderChoice(q,P,O); else if(q.type==='numbering') renderNumbering(q,P,O); else renderMulti(q,P,O);
}
function renderChoice(q,P,O){
  P.innerHTML=typeof q.prompt==='function'?q.prompt():q.prompt;
  O.className='options '+(q.grid||''); O.innerHTML=q.options.map((o,i)=>`<button class="opt ${o.cls||''}" data-i="${i}">${esc(o.label)}</button>`).join('');
}
function renderNumbering(q,P,O){
  P.innerHTML=`<p class="ask">${esc(q.prompt)}</p><div class="numwords">${q.words.map((w,i)=>`<button class="nw${i===q.sel?' sel':''}" data-i="${i}"><span class="n">${q.vals[i]||'&nbsp;'}</span><span class="w">${esc(w)}</span></button>`).join('')}</div>`;
  O.className='options keypad'; O.innerHTML=DRUHY.map(d=>`<button class="opt key" data-n="${d.n}"><b>${d.n}</b>${d.name}</button>`).join('')+'<button class="opt primary wide" id="checkBtn">Zkontrolovat</button>';
}
function renderMulti(q,P,O){
  P.innerHTML=`<p class="ask">Urči osobu, číslo, způsob a čas slovesného tvaru:</p><p class="word-big">${esc(q.verb)}</p><div class="rows">${q.rows.map((r,ri)=>`<div class="row"><span class="lbl">${r.label}</span><div class="seg">${r.opts.map((o,oi)=>`<button class="segb${q.vals[ri]===oi?' sel':''}" data-r="${ri}" data-o="${oi}">${esc(o)}</button>`).join('')}</div></div>`).join('')}</div>`;
  O.innerHTML='<button class="opt primary" id="checkBtn">Zkontrolovat</button>';
}

/* ---------- vyhodnocení ---------- */
// Po odpovědi se vždy objeví tlačítko Další a ťuknutí kamkoli do otázky posune dál hned; jinak se posune samo.
function pridejDalsi(){ if($('#nextQ')) return; const b=document.createElement('button'); b.className='opt primary wide'; b.id='nextQ'; b.textContent=state.i+1>=state.qs.length?'Dokončit →':'Další →'; $('#qOptions').appendChild(b); }
function naplanujDalsi(ms){ state.cekaNext=true; clearTimeout(state.nextT); state.nextT=setTimeout(next,ms); pridejDalsi(); }
function vyplnMezery(q){ if(q.fill) document.querySelectorAll('#qPrompt .gap.cur').forEach(g=>{ g.textContent=q.fill; g.classList.add('filled'); g.classList.remove('cur'); }); }
function spravne(q,el){
  state.locked=true; if(state.qErr===0) state.points++; state.streak++; ukazSerii();
  if(el) el.classList.add('ok'); Snd.ding(); feedback(q.why||'Správně.','ok'); konfety(el||$('#qcard')); vyplnMezery(q);
  Figurky.radost();
  if(state.streak>0&&state.streak%5===0){ Kone.bezte(); Figurky.rekni(state.streak+' v řadě. Koně!',2600); if(state.streak%10===0) FW.salva(3); }
  else Figurky.rekni(pick(CHVALA),2000);
  naplanujDalsi(q.why?3000:1500);
}
function spatne(q,el){
  state.qErr++; state.streak=0; ukazSerii(); Snd.buzz(); if(el){ el.classList.add('bad'); el.disabled=true; }
  Figurky.smutek(); Figurky.rekni(pick(UTECHA),2000);
  if(state.qErr===1){ feedback('Zkus to ještě jednou.','bad'); return false; }
  return true;   // podruhé špatně: ukázat řešení
}
function odhal(q){
  state.locked=true;
  if(q.type==='choice'){ const idx=q.options.findIndex(o=>o.value===q.answer); const b=$('#qOptions').children[idx]; if(b) b.classList.add('ok'); feedback('Správně: '+q.options[idx].label+(q.why?' – '+q.why:''),'bad'); vyplnMezery(q); }
  naplanujDalsi(3400);
}
function choose(i,btn){ if(state.locked||!btn||btn.disabled) return; const q=cur(); if(q.options[i].value===q.answer) spravne(q,btn); else if(spatne(q,btn)) odhal(q); }
function chybiNeco(t){ feedback(t,'bad'); const b=$('#checkBtn'); if(b){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } Snd.buzz(); Figurky.rekni('Ještě něco chybí.',1800); }
function checkNumbering(q){
  if(state.locked) return; const chips=[...document.querySelectorAll('#qPrompt .nw')];
  if(q.vals.some(v=>!v)){ chybiNeco('Doplň číslo ke každému slovu.'); return; }
  const wrong=q.vals.map((v,i)=>v!==q.answer[i]?i:-1).filter(i=>i>=0);
  if(!wrong.length){ chips.forEach(c=>c.classList.add('ok')); spravne(Object.assign({},q,{why:'Správně: '+q.answer.join(' ')}),null); return; }
  chips.forEach((c,i)=>c.classList.toggle('bad',wrong.includes(i)));
  if(spatne(q,null)){ state.locked=true; chips.forEach((c,i)=>{ c.classList.remove('bad'); c.classList.add('ok'); c.querySelector('.n').textContent=q.answer[i]; }); feedback('Správně: '+q.words.map((w,i)=>q.answer[i]+' '+w).join(' · '),'bad'); naplanujDalsi(3600); }
  else feedback('Červená čísla nesedí. Oprav je a zkontroluj znovu.','bad');
}
function checkMulti(q){
  if(state.locked) return;
  if(q.vals.some(v=>v<0)){ chybiNeco('Vyber něco v každém řádku.'); return; }
  const rows=[...document.querySelectorAll('#qPrompt .row')]; const wrong=q.vals.map((v,i)=>v!==q.answer[i]?i:-1).filter(i=>i>=0);
  if(!wrong.length){ rows.forEach(r=>r.querySelector('.segb.sel').classList.add('ok')); spravne(Object.assign({},q,{why:'Správně: '+q.answer.map((a,i)=>q.rows[i].opts[a]).join(', ')}),null); return; }
  rows.forEach((r,i)=>{ const s=r.querySelector('.segb.sel'); if(s) s.classList.toggle('bad',wrong.includes(i)); });
  if(spatne(q,null)){ state.locked=true; rows.forEach((r,i)=>{ r.querySelectorAll('.segb').forEach(b=>b.classList.remove('sel','bad')); r.querySelectorAll('.segb')[q.answer[i]].classList.add('ok'); }); feedback('Správně: '+q.answer.map((a,i)=>q.rows[i].opts[a]).join(', ')+(q.answer[2]>0?' (u rozkazovacího a podmiňovacího způsobu se čas neurčuje)':''),'bad'); naplanujDalsi(3600); }
  else feedback('Červené řádky nesedí. Oprav je a zkontroluj znovu.','bad');
}
function next(){ clearTimeout(state.nextT); state.cekaNext=false; if(state.oslava) return; state.i++; if(state.i>=state.qs.length) finish(); else renderQuestion(); }
function finish(){
  $('#progFill').style.width='100%'; const p=state.points,t=state.qs.length; const b=store.best[state.ex.id]; if(!b||p>b.p) store.best[state.ex.id]={p,t}; save(); $('#bodyCelkem').textContent=bodyCelkem();
  $('#qOptions').innerHTML=''; feedback(''); $('#streak').textContent='';
  oslava(p,t);
}

/* ---------- oslava na konci: úklidová četa zamete cvičení, pak noc a rachejtle, nakonec koně a výsledek ---------- */
let skipOslavy=null;
function cekej(ms){ return new Promise(r=>{ const t=setTimeout(()=>{ skipOslavy=null; r(); },ms); skipOslavy=()=>{ clearTimeout(t); skipOslavy=null; r(); }; }); }
async function oslava(p,t){
  state.oslava=true; state.locked=true; let preskoceno=false;
  const preskoc=()=>{ preskoceno=true; if(skipOslavy) skipOslavy(); };
  setTimeout(()=>document.addEventListener('pointerdown',preskoc,{once:true}),300);
  Snd.fanfare(); Figurky.rekni(p===t?'Bez chyby! Úklid a rachejtle!':'Hotovo! Úklid a rachejtle!',3200); [0,1200,2400].forEach(d=>setTimeout(()=>Figurky.radost(),d));
  await cekej(1600);
  if(!preskoceno){
    const els=['#exTitle','.status','#qcard','#qOptions','#feedback'].map(s=>$(s)); let k=0;
    await new Promise(res=>{ let hotovo=false; const konec=()=>{ if(hotovo) return; hotovo=true; skipOslavy=null; Uklizeci.stop(); res(); };
      Uklizeci.start({pocet:4,rychlost:190,onProgress:f=>{ while(k<els.length&&f>0.12+k*0.17){ els[k].classList.add('swept'); Snd.tick(); k++; } },onDone:konec});
      skipOslavy=konec; setTimeout(konec,9000); });   // pojistka: kdyby četa nedoběhla (třeba skrytá karta), jde se dál
    els.forEach(e=>e.classList.add('swept'));
  }
  if(!preskoceno){ $('#noc').classList.add('on'); await cekej(700); }
  if(!preskoceno){ FW.start(); await cekej(5500); }
  FW.stop(); $('#noc').classList.remove('on'); Uklizeci.stop(); document.removeEventListener('pointerdown',preskoc);
  uklid(); vysledek(p,t); Kone.bezte(); setTimeout(()=>Figurky.rekni(p===t?'Bez jediné chyby!':'Hotovo. Koně!',2600),300);
  state.oslava=false;
}
function vysledek(p,t){
  const msg=p===t?'Bez jediné chyby. Tohle se v sešitě nevidí.':p>=t*0.8?'Skvělé. Pár chyb, ale jasný výsledek.':'Hotovo. Zkus to ještě jednou, půjde to líp.';
  $('#qPrompt').innerHTML=`<div class="vysledek"><h3>Hotovo</h3><div class="skore">${p} z ${t}</div><p>${esc(msg)}</p><p class="hint">Body se počítají za odpovědi napoprvé.</p></div>`;
  const O=$('#qOptions'); O.className='options'; O.innerHTML='<button class="opt primary" id="nextEx">Další cvičení →</button><button class="opt" id="againEx">Ještě jednou</button><button class="opt" id="backEx">Zpět na přehled</button>';
  feedback('');
}

/* ---------- konfety u správné odpovědi ---------- */
function konfety(el){ if(!el) return; const r=el.getBoundingClientRect(); const x=r.left+r.width/2,y=r.top+r.height/2; const fx=$('#fx');
  for(let i=0;i<22;i++){ const p=document.createElement('i'); p.className='cf'; p.style.left=x+'px'; p.style.top=y+'px'; p.style.background=pick(KONFETY); const a=Math.random()*Math.PI*2,d=70+Math.random()*120; p.style.setProperty('--dx',Math.cos(a)*d+'px'); p.style.setProperty('--dy',(Math.sin(a)*d-80)+'px'); p.style.setProperty('--rot',(Math.random()*720-360)+'deg'); fx.appendChild(p); setTimeout(()=>p.remove(),1100); } }

/* ---------- úklidová četa: lidé s košťaty projdou spodkem obrazovky a ženou před sebou písmenka ---------- */
const Uklizeci=(()=>{
  const CERNA='#0b0b0b', PRACH='rgba(70,64,58,';
  let canvas,ctx,W=0,H=96,crew=[],prach=[],smeti=[],bezi=false,posledni=0,cb={};
  const cara=(c,x0,y0,x1,y1)=>{ c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.stroke(); };
  function ensure(){ if(!canvas){ canvas=document.createElement('canvas'); canvas.className='uklizeci'; canvas.setAttribute('aria-hidden','true'); Object.assign(canvas.style,{position:'fixed',left:0,bottom:0,display:'none',pointerEvents:'none',zIndex:41}); document.body.appendChild(canvas); ctx=canvas.getContext('2d'); }
    W=document.documentElement.clientWidth; const dpr=Math.min(2,devicePixelRatio||1); canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function kresli(c,u){
    const h=u.h,y=H-8,sw=Math.sin(u.faze),sw2=Math.sin(u.faze+Math.PI);
    c.save(); c.translate(u.x,y); c.strokeStyle=CERNA; c.fillStyle=CERNA; c.lineCap='round'; c.lineJoin='round'; c.lineWidth=Math.max(1.4,h*0.14);
    const hipY=-h*0.38,hlavaY=-h*0.86,ramY=hlavaY+h*0.24;
    cara(c,0,hipY,sw*0.3*h,0); cara(c,0,hipY,sw2*0.3*h,0);                 // nohy
    cara(c,0,hlavaY+h*0.16,0,hipY);                                           // trup
    if(u.sukne){ c.beginPath(); c.moveTo(-h*0.17,hipY+h*0.05); c.lineTo(h*0.17,hipY+h*0.05); c.lineTo(h*0.04,hipY-h*0.22); c.lineTo(-h*0.04,hipY-h*0.22); c.closePath(); c.fill(); }
    const kyv=Math.sin(u.faze*2)*h*0.14, hx=h*0.32, hy=ramY+h*0.22;         // ruce drží násadu
    cara(c,0,ramY,hx,hy); cara(c,0,ramY,hx+h*0.12,hy-h*0.18);
    const kx=h*0.95+kyv, ky=-1;
    c.lineWidth=Math.max(1.2,h*0.09); cara(c,hx,hy-h*0.08,kx,ky);            // násada
    c.lineWidth=Math.max(1.8,h*0.22); cara(c,kx-h*0.1,ky,kx+h*0.22,ky);       // štětiny
    c.lineWidth=Math.max(1.4,h*0.14);
    c.beginPath(); c.arc(0,hlavaY,h*0.13,0,Math.PI*2); c.fill();             // hlava
    if(u.cepice) cara(c,-h*0.1,hlavaY-h*0.1,h*0.26,hlavaY-h*0.1);
    if(u.sukne) cara(c,-h*0.1,hlavaY,-h*0.1,hlavaY+h*0.16);
    c.restore();
    u.spicka=u.x+kx+h*0.22;
    if(Math.random()<0.4) prach.push({x:u.spicka,y:H-8,r:1+Math.random()*1.8,zivot:0,delka:.45+Math.random()*.4,vx:30+Math.random()*50,vy:-10-Math.random()*16});
  }
  function start(o={}){ ensure(); cb=o; const n=o.pocet||3; crew=[];
    for(let i=0;i<n;i++) crew.push({x:-50-i*(48+Math.random()*36),h:17+Math.random()*5,faze:Math.random()*6,rychlost:(o.rychlost||150)*(0.93+Math.random()*0.14),cepice:Math.random()<0.5,sukne:Math.random()<0.4,spicka:-50});
    smeti=o.smeti===false?[]:['i','y','ě','s','z','mně','í','ý','je'].map((z,i)=>({z,x:30+i*(W/10)+Math.random()*30,y:0,vy:0,rot:(Math.random()-.5)*.6}));
    prach=[]; canvas.style.display='block'; if(!bezi){ bezi=true; posledni=performance.now(); requestAnimationFrame(snimek); } }
  function stop(){ bezi=false; crew=[]; prach=[]; smeti=[]; cb={}; if(canvas){ canvas.style.display='none'; ctx.clearRect(0,0,W,H); } }
  function posun(dt,t){
    for(const p of prach){ p.zivot+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=14*dt; p.r+=5*dt; } prach=prach.filter(p=>p.zivot<p.delka);
    let lead=-1e9;
    for(const u of crew){ const v=u.rychlost*(1+0.06*Math.sin(t/700+u.h)); u.x+=v*dt; u.faze+=dt*v/(u.h*1.1); lead=Math.max(lead,u.spicka||u.x); }
    for(const s of smeti){ if(lead>s.x-6){ s.x=lead+6+Math.random()*12; if(s.y>=0) s.vy=-70-Math.random()*110; s.rot+=(Math.random()-.5)*1.5; } s.vy+=420*dt; s.y+=s.vy*dt; if(s.y>0){ s.y=0; s.vy=0; } }
    return lead;
  }
  function vykresli(){ ctx.clearRect(0,0,W,H);
    for(const p of prach){ const a=Math.max(0,1-p.zivot/p.delka)*0.18; ctx.fillStyle=PRACH+a+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle=CERNA; ctx.font='15px "Archivo Black","Arial Black",sans-serif'; ctx.textBaseline='bottom';
    for(const s of smeti){ ctx.save(); ctx.translate(s.x,H-8+s.y); ctx.rotate(s.rot); ctx.fillText(s.z,0,0); ctx.restore(); }
    for(const u of crew) kresli(ctx,u); }
  function snimek(t){ if(!bezi) return; const dt=Math.min(0.05,(t-posledni)/1000||0.016); posledni=t; const lead=posun(dt,t); vykresli();
    if(cb.onProgress) cb.onProgress(lead/W);
    if(crew.length&&crew.every(u=>u.x>W+60)){ const d=cb.onDone; stop(); if(d) d(); return; }
    requestAnimationFrame(snimek); }
  return {start,stop};
})();

/* ---------- rachejtle ---------- */
const FW={on:false,raf:0,parts:[],rockets:[],lastLaunch:0,ctx:null,W:0,H:0,doba:0,
  COLORS:['#ffffff','#ff4d6d','#4d8bff','#ffd23f','#2fbf71','#ff8f1f','#c77dff'],
  ensure(){ const c=$('#fw'); const dpr=Math.min(2,window.devicePixelRatio||1); this.W=window.innerWidth; this.H=window.innerHeight; c.width=this.W*dpr; c.height=this.H*dpr; this.ctx=c.getContext('2d'); this.ctx.setTransform(dpr,0,0,dpr,0,0); },
  start(){ this.ensure(); $('#fw').style.display='block'; this.parts=[]; this.rockets=[]; this.on=true; this.doba=Infinity; this.lastLaunch=0; this.ctx.clearRect(0,0,this.W,this.H); cancelAnimationFrame(this.raf); this.raf=requestAnimationFrame(t=>this.loop(t)); },
  salva(n){ this.ensure(); $('#fw').style.display='block'; if(!this.on){ this.parts=[]; this.rockets=[]; this.on=true; cancelAnimationFrame(this.raf); this.raf=requestAnimationFrame(t=>this.loop(t)); } this.doba=n; this.lastLaunch=0; },
  stop(){ this.on=false; cancelAnimationFrame(this.raf); if(this.ctx) this.ctx.clearRect(0,0,this.W,this.H); $('#fw').style.display='none'; },
  launch(){ const x=this.W*(0.15+Math.random()*0.7); this.rockets.push({x,y:this.H+10,vx:(Math.random()-.5)*1.5,vy:-(9+Math.random()*4)*Math.max(.6,this.H/700),color:pick(this.COLORS),ty:this.H*(0.15+Math.random()*0.35)}); Snd.whistle(); },
  explode(r){ const n=60+Math.floor(Math.random()*50); const k=Math.max(.6,this.H/700); for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=(2+Math.random()*5)*k; this.parts.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.011+Math.random()*.012,color:Math.random()<.8?r.color:'#fff',size:2+Math.random()*2.2}); } Snd.boom(); },
  loop(t){ if(!this.on) return; const ctx=this.ctx; ctx.globalCompositeOperation='destination-out'; ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(0,0,this.W,this.H); ctx.globalCompositeOperation='lighter';
    if(t-this.lastLaunch>560&&this.doba>0){ this.launch(); this.lastLaunch=t; if(this.doba!==Infinity) this.doba--; }
    this.rockets=this.rockets.filter(r=>{ r.x+=r.vx; r.y+=r.vy; r.vy+=.12; ctx.fillStyle=r.color; ctx.beginPath(); ctx.arc(r.x,r.y,3,0,7); ctx.fill(); if(r.vy>=-1||r.y<=r.ty){ this.explode(r); return false; } return true; });
    this.parts=this.parts.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.045; p.vx*=.985; p.vy*=.985; p.life-=p.decay; if(p.life<=0) return false; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); return true; });
    ctx.globalAlpha=1;
    if(this.doba<=0&&!this.rockets.length&&!this.parts.length){ this.stop(); return; }
    this.raf=requestAnimationFrame(tt=>this.loop(tt)); }
};

/* ---------- srandy jen tak: každou chvíli se něco stane (vítr s čepicemi, déšť, blesk, koně, uklízeč) ---------- */
let srandaT=null;
function prsi(zap){ Figurky.pocasi.dest(zap); $('.hero').classList.toggle('prsi',zap); }
function blesk(){ const b=$('#blesk'); b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); Figurky.pocasi.blesk(); Snd.boom(); }
function udelejSrandu(){
  const r=Math.random();
  if(r<.24){ Figurky.pocasi.vitr(Math.random()<.5?-1:1,4000); Figurky.rekni(pick(['Fouká! Držte si čepice!','Vítr!']),2500); }
  else if(r<.44){ prsi(true); Figurky.rekni(pick(['Prší, schovat!','Déšť. Rychle pod písmenko.']),2500); setTimeout(()=>prsi(false),7000); }
  else if(r<.58){ blesk(); setTimeout(()=>Figurky.rekni(pick(['Jé, blesk!','To byla rána.']),2200),400); }
  else if(r<.8){ Kone.bezte(); Figurky.rekni(pick(['Zase ti koně.','Kdo je pustil?','Koně! Uhněte!']),2500); }
  else { Uklizeci.start({pocet:1+Math.floor(Math.random()*2),rychlost:120}); Figurky.rekni(pick(['Tady se uklízí.','Pozor, úklid!','Nešlapte mi do toho.']),2500); }
}
function naplanujSrandu(){ clearTimeout(srandaT); srandaT=setTimeout(()=>{ if(!document.hidden&&!state.oslava&&!matchMedia('(prefers-reduced-motion: reduce)').matches) udelejSrandu(); naplanujSrandu(); },28000+Math.random()*32000); }

/* ---------- nuda: když se nic neděje ---------- */
let posledniAktivita=performance.now(), nudil=false;
['pointerdown','keydown','scroll'].forEach(ev=>addEventListener(ev,()=>{ posledniAktivita=performance.now(); nudil=false; },{passive:true}));
setInterval(()=>{ if(document.hidden||nudil||state.oslava) return; if(performance.now()-posledniAktivita>35000){ nudil=true; Figurky.rekni(pick(NUDA),4000); Figurky.smutek(); } },5000);

/* ---------- události ---------- */
function bind(){
  $('#areaList').addEventListener('click',e=>{ const b=e.target.closest('[data-area]'); if(b){ Snd.tick(); renderArea(b.dataset.area); } });
  $('#exList').addEventListener('click',e=>{ const b=e.target.closest('[data-ex]'); if(b){ Snd.tick(); startExercise(b.dataset.ex); } });
  $('#areaBack').addEventListener('click',()=>{ Snd.tick(); renderHome(); });
  $('#exBack').addEventListener('click',()=>{ Snd.tick(); clearTimeout(state.nextT); Uklizeci.stop(); FW.stop(); $('#noc').classList.remove('on'); state.oslava=false; renderArea(state.area.id); });
  $('#mute').addEventListener('click',()=>{ store.muted=!store.muted; Snd.muted=store.muted; save(); updateMute(); if(!store.muted){ Snd.init(); Snd.tick(); } });
  $('#qOptions').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||state.oslava) return;
    if(b.id==='nextEx'){ const list=state.area.ex,k=list.indexOf(state.ex.id); if(k>=0&&k<list.length-1) startExercise(list[k+1]); else renderArea(state.area.id); return; }
    if(b.id==='againEx'){ startExercise(state.ex.id); return; }
    if(b.id==='backEx'){ renderArea(state.area.id); return; }
    if(b.id==='nextQ'||(state.locked&&state.cekaNext)){ Snd.tick(); next(); return; }
    const q=cur(); if(!q) return;
    if(q.type==='choice') choose(+b.dataset.i,b);
    else if(b.id==='checkBtn'){ q.type==='numbering'?checkNumbering(q):checkMulti(q); }
    else if(q.type==='numbering'&&b.dataset.n){ if(state.locked) return; Snd.tick(); Figurky.poskok(); q.vals[q.sel]=+b.dataset.n; const chips=[...document.querySelectorAll('#qPrompt .nw')]; chips[q.sel].querySelector('.n').textContent=b.dataset.n; chips[q.sel].classList.remove('bad'); const dalsi=q.vals.findIndex((v,i)=>!v&&i>q.sel); const prvni=q.vals.findIndex(v=>!v); q.sel=dalsi>=0?dalsi:(prvni>=0?prvni:q.sel); chips.forEach((c,i)=>c.classList.toggle('sel',i===q.sel)); }
  });
  $('#qPrompt').addEventListener('click',e=>{ if(state.oslava) return; if(state.locked&&state.cekaNext){ Snd.tick(); next(); return; } const b=e.target.closest('button'); if(!b||state.locked) return; const q=cur(); if(!q) return;
    if(q.type==='numbering'&&b.classList.contains('nw')){ q.sel=+b.dataset.i; document.querySelectorAll('#qPrompt .nw').forEach((c,i)=>c.classList.toggle('sel',i===q.sel)); Snd.tick(); }
    else if(q.type==='multi'&&b.classList.contains('segb')){ const r=+b.dataset.r,o=+b.dataset.o; q.vals[r]=o; b.parentNode.querySelectorAll('.segb').forEach(x=>x.classList.remove('sel','bad')); b.classList.add('sel'); Snd.tick(); Figurky.poskok(); }
  });
  window.addEventListener('resize',()=>{ if(FW.on){ FW.ensure(); } });
}
function start(){
  load(); renderAreaList(); bind(); renderHome();
  Figurky.start($('#h1'),{pocet:12,hned:true});
  Figurky.linky([$('#qcard'),$('#pata')],'top',{ozivaji:true,hlasky:HLASKY,hned:true});
  Figurky.linky([$('#qcard')],'bottom',{ozivaji:true,hlasky:HLASKY,hned:true});
  Figurky.linky(document.querySelectorAll('#areaList .areaCard'),'top',{ozivaji:true,hlasky:HLASKY,hned:true});
  naplanujSrandu();
}
start();
})();
